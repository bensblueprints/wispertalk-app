<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Activate WisperTalk</title>
  <link rel="stylesheet" href="license.css" />
</head>
<body>
  <main>
    <header>
      <div class="brand">
        <div class="logo"></div>
        <div>
          <div class="title"><em>Wisper</em>Talk</div>
          <div class="subtitle">Voice dictation for Windows &amp; Mac</div>
        </div>
      </div>
    </header>

    <section class="hero">
      <h1>Confirm your <em>purchase</em>.</h1>
      <p class="lede">
        Enter the email you used when buying WisperTalk on Whop.
        We'll check your purchase and unlock the app — no license key needed.
      </p>

      <form id="form">
        <label>Purchase email</label>
        <input
          id="key"
          type="email"
          autocomplete="email"
          spellcheck="false"
          placeholder="you@example.com"
          autofocus
        />
        <div id="error" class="error hidden"></div>
        <button type="submit" id="submit" class="btn-primary">Unlock WisperTalk</button>
      </form>

      <div class="meta">
        <a href="#" id="buy">Haven't bought yet? Get WisperTalk — $49.99 lifetime →</a>
        <a href="#" id="quit" class="quit">Quit</a>
      </div>
    </section>
  </main>
  <script src="license.js"></script>
</body>
</html>
