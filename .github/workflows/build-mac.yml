name: Build Mac DMG

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - '.github/workflows/build-mac.yml'
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Python 3.11 (node-gyp needs distutils)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm install

      - name: Build Mac DMG + ZIP (unsigned, arm64 + x64)
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: List dist contents
        if: always()
        run: ls -lh dist/ || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WisperTalk-Mac
          path: |
            dist/*.dmg
            dist/*.zip
            dist/latest-mac.yml
            dist/*.blockmap
          if-no-files-found: error

      - name: Publish draft release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}-mac
          name: WisperTalk Mac build (run ${{ github.run_number }})
          draft: true
          generate_release_notes: false
          files: |
            dist/*.dmg
            dist/*.zip
            dist/latest-mac.yml
